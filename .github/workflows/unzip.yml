name: Unzip Plugin
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and clean up
        run: |
          if [ -f "aliucord-pokemon-catch-classifier.zip" ]; then
            unzip -o "aliucord-pokemon-catch-classifier.zip"
            rm -f "aliucord-pokemon-catch-classifier.zip"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Extract AutoPokemonCatchClassifier"
            git push
          fi
